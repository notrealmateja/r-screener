name: Daily Stock Screener Update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libharfbuzz-dev libfribidi-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c(
            "rsconnect", "shiny", "shinydashboard",
            "quantmod", "tidyverse", "httr", "jsonlite",
            "lubridate", "tidyquant", "TTR", "glue",
            "DT", "plotly", "scales", "readr"
          ), repos = "https://cloud.r-project.org")'

      - name: Run data pipeline
        run: |
          Rscript -e '
            setwd(getwd())
            source("R/01_fundamentals.R")   # Yahoo + Alpha Vantage (rotating cache)
            source("R/02_momentum.R")       # Price, technicals, daily alpha vs SPY
            source("R/02b_polygon.R")       # Polygon: options, SEC financials, VWAP
            source("R/03_data.R")           # FMP: short interest, earnings, news, sector
            source("R/04_master_score.R")   # Composite alpha scoring engine

            fund_data  <- run_module1()
            mom_data   <- run_module2(fund_data$symbol)
            run_module_polygon(fund_data$symbol)
            run_module3(fund_data$symbol)
            run_module4()

            # Copy all generated CSVs and RDS into app/ so Shiny can read them
            csv_files <- list.files("data", pattern = "\\.csv$", full.names = TRUE)
            file.copy(csv_files, file.path("app", basename(csv_files)), overwrite = TRUE)
            rds_files <- list.files("data", pattern = "\\.rds$", full.names = TRUE)
            file.copy(rds_files, file.path("app", basename(rds_files)), overwrite = TRUE)
            message("Copied ", length(csv_files) + length(rds_files), " data files into app/")
          '

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e '
            library(rsconnect)
            rsconnect::setAccountInfo(
              name   = Sys.getenv("SHINYAPPS_ACCOUNT"),
              token  = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            )
            rsconnect::deployApp(appDir = "app", forceUpdate = TRUE)
          '

      - name: Commit updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # alpha_history.csv is the compounding record — must be committed every day
          # Commit: alpha_history + av_cache + polygon_cache must persist across runs
          git add data/alpha_history.csv data/av_cache.csv data/polygon_cache.csv \
                  data/*.csv data/*.rds app/*.csv app/*.rds app/data/*.rds
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update: Daily alpha refresh $(date +'%Y-%m-%d')"
          git push
