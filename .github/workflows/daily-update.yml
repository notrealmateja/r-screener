name: Daily Stock Screener Update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'
          # Use Posit binary package manager — pre-built Ubuntu binaries,
          # no compilation, no missing system libs, installs in ~2 min
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e '
            # Posit binary repo — pre-compiled for ubuntu-latest (jammy)
            options(repos = c(
              RSPM = "https://packagemanager.posit.co/cran/__linux__/jammy/latest",
              CRAN = "https://cloud.r-project.org"
            ))

            # Install in dependency order, each group explicit
            # Group 1 — core data packages (no heavy deps)
            install.packages(c(
              "httr", "jsonlite", "readr", "dplyr", "tidyr",
              "glue", "lubridate", "scales"
            ))

            # Group 2 — time-series / finance base
            install.packages(c("xts", "zoo", "TTR", "quantmod"))

            # Group 3 — tidyquant (depends on groups 1+2 being present)
            install.packages("tidyquant")

            # Group 4 — Shiny stack
            install.packages(c("shiny", "shinydashboard", "DT", "plotly"))

            # Group 5 — deployment
            install.packages("rsconnect")

            # Hard verification — fail NOW if anything is missing
            required <- c(
              "httr","jsonlite","readr","dplyr","tidyr","glue","lubridate",
              "scales","xts","zoo","TTR","quantmod","tidyquant",
              "shiny","shinydashboard","DT","plotly","rsconnect"
            )
            missing <- required[!sapply(required, requireNamespace, quietly=TRUE)]
            if (length(missing) > 0) stop("MISSING: ", paste(missing, collapse=", "))
            message("ALL PACKAGES OK")
          '

      - name: Run data pipeline
        run: |
          Rscript -e '
            source("R/01_fundamentals.R")
            source("R/02_momentum.R")
            source("R/02b_polygon.R")
            source("R/03_data.R")
            source("R/04_master_score.R")

            fund_data <- run_module1()
            run_module2(fund_data$symbol)
            run_module_polygon(fund_data$symbol)
            run_module3(fund_data$symbol)
            run_module4()

            csv_files <- list.files("data", pattern="\\.csv$", full.names=TRUE)
            file.copy(csv_files, file.path("app", basename(csv_files)), overwrite=TRUE)
            rds_files <- list.files("data", pattern="\\.rds$", full.names=TRUE)
            file.copy(rds_files, file.path("app", basename(rds_files)), overwrite=TRUE)
            if (!dir.exists("app/data")) dir.create("app/data")
            file.copy(rds_files, file.path("app/data", basename(rds_files)), overwrite=TRUE)
            message("Copied ", length(csv_files)+length(rds_files), " files into app/")
          '

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e '
            library(rsconnect)
            rsconnect::setAccountInfo(
              name   = Sys.getenv("SHINYAPPS_ACCOUNT"),
              token  = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            )
            rsconnect::deployApp(appDir="app", forceUpdate=TRUE)
          '

      - name: Commit updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/alpha_history.csv data/av_cache.csv data/polygon_cache.csv \
                  data/*.csv data/*.rds app/*.csv app/*.rds app/data/*.rds
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "Auto-update: Daily alpha refresh $(date +'%Y-%m-%d')"
          git push
