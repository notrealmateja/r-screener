name: Daily Stock Screener Update

on:
  schedule:
    # 21:30 UTC = 5:30pm ET, after the US close, so each run captures the same
    # day's close.  The previous 06:00 UTC slot ran at 2am ET — before the open —
    # so every run used the prior trading day, and Sat/Sun/Mon all reused
    # Friday's close and produced near-identical output.
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write      # a failed run opens/updates a tracking issue

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history. The default shallow clone leaves a single commit, so
          # `git log -1 -- <file>` returns the same timestamp for every file and
          # the data-health table reports identical ages for all of them —
          # making its STALE check unreachable.
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e '
            options(repos = c(
              RSPM = "https://packagemanager.posit.co/cran/__linux__/jammy/latest",
              CRAN = "https://cloud.r-project.org"
            ))
            install.packages(c("httr","jsonlite","readr","dplyr","tidyr","glue","lubridate","scales"))
            install.packages("xml2")   # RSS parsing for per-ticker news
            install.packages(c("xts","zoo","TTR","quantmod"))
            install.packages("tidyquant")  # Module 2 uses tq_get() for price data
            install.packages(c("shiny","shinydashboard","DT","plotly","ggplot2"))

            # Pin rsconnect to 0.8.29 — last version before renv was introduced.
            # v1.0+ renv pre-flight validation always fails in GitHub Actions CI.
            install.packages("remotes")
            remotes::install_version("rsconnect", version="0.8.29",
              repos="https://cloud.r-project.org", upgrade="never")

            install.packages("testthat")

            required <- c("httr","jsonlite","readr","dplyr","tidyr","glue","lubridate",
                          "scales","xts","zoo","TTR","quantmod","xml2",
                          "shiny","shinydashboard","DT","plotly","ggplot2","rsconnect",
                          "testthat")
            missing <- required[!sapply(required, requireNamespace, quietly=TRUE)]
            if (length(missing) > 0) stop("MISSING: ", paste(missing, collapse=", "))
            message("ALL PACKAGES OK")
          '

      # Runs before the pipeline so a broken change fails fast, without first
      # burning API quota or deploying bad output to the live site.
      - name: Run unit tests
        run: |
          Rscript -e '
            library(testthat)
            res <- test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)
            message("Tests passed.")
          '

      - name: Run data pipeline
        env:
          AV_KEY: ${{ secrets.AV_KEY }}
          POLY_KEY: ${{ secrets.POLY_KEY }}
          # Resolves each channel's current live video id. Without it the
          # pipeline holds whatever ids are already committed rather than
          # blanking the panel.
          YT_KEY: ${{ secrets.YT_KEY }}
          # Consensus EPS estimates for the earnings calendar. SEC supplies the
          # dates but publishes no estimate; without this the column is blank.
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: |
          Rscript -e '
            # Prevent modules from auto-running on source()
            SOURCED_BY_MASTER <- TRUE

            source("R/01_fundamentals.R")
            source("R/02_momentum.R")
            source("R/02b_polygon.R")
            source("R/03_data.R")
            source("R/04_master_score.R")
            source("R/05_backtest.R")

            fund_data <- run_module1()
            run_module2(fund_data$symbol)
            run_module_polygon(fund_data$symbol)
            run_module3(fund_data$symbol)
            run_module4()
            # Walk-forward validation of the score, plus the per-component
            # diagnostic. Both non-fatal: a validation failure must never block
            # the data refresh or the deploy.
            tryCatch(run_backtest(),
                     error = function(e) message("Backtest skipped: ", conditionMessage(e)))
            tryCatch(run_component_diagnostic(),
                     error = function(e) message("Component diagnostic skipped: ",
                                                 conditionMessage(e)))
            tryCatch(run_reversal_test(),
                     error = function(e) message("Reversal test skipped: ",
                                                 conditionMessage(e)))

            csv_files <- list.files("data", pattern="\\.csv$", full.names=TRUE)
            file.copy(csv_files, file.path("app", basename(csv_files)), overwrite=TRUE)

            # The app never reads past 400 days: the Deep Dive chart filters to
            # 365 and the live fallback pulls 400. Shipping the full three-year
            # pull made price_history.csv 47MB of a 53MB bundle for data no
            # screen displays. The pipeline keeps the full file under data/.
            APP_PRICE_DAYS <- 400
            ph <- "app/price_history.csv"
            if (file.exists(ph)) {
              pp <- suppressWarnings(readr::read_csv(ph, show_col_types = FALSE))
              if (nrow(pp) > 0 && "date" %in% names(pp)) {
                before <- nrow(pp)
                pp <- pp[pp$date >= Sys.Date() - APP_PRICE_DAYS, ]
                readr::write_csv(pp, ph)
                message(sprintf("Trimmed app price history: %s -> %s rows (%.1f MB)",
                                format(before, big.mark=","), format(nrow(pp), big.mark=","),
                                file.size(ph)/1024^2))
              }
            }
            rds_files <- list.files("data", pattern="\\.rds$", full.names=TRUE)
            file.copy(rds_files, file.path("app", basename(rds_files)), overwrite=TRUE)
            if (!dir.exists("app/data")) dir.create("app/data")
            file.copy(rds_files, file.path("app/data", basename(rds_files)), overwrite=TRUE)
            message("Copied ", length(csv_files)+length(rds_files), " files into app/")
          '

      - name: Verify pipeline output
        if: always()
        run: |
          Rscript -e '
            suppressMessages(library(readr))
            files <- c("data/master_scored.csv","data/top15_sweetspot.csv",
                       "data/top15_unicorns.csv","data/alpha_history.csv",
                       "data/market_news.csv","data/earnings_calendar.csv",
                       "data/wsb_trending.csv","data/stocktwits_trending.csv",
                       "data/macro_data.csv","data/sector_performance.csv",
                       "data/stock_news.csv","data/sec_filings.csv",
                       "data/sec_financials.csv","data/tv_channels.csv")
            # Age is measured from the last commit that CHANGED the file, so a
            # legitimately slow-moving file would otherwise trip STALE every day.
            # Company financials only move when a 10-Q or 10-K lands.
            max_age <- c("data/sec_financials.csv" = 24 * 120)
            out <- c("## Data health", "",
                     "| File | Rows | Age (h) | Status |", "|---|---:|---:|---|")
            problems <- character(0)
            for (f in files) {
              if (!file.exists(f)) {
                out <- c(out, sprintf("| `%s` | - | - | MISSING |", basename(f)))
                problems <- c(problems, paste(basename(f), "missing"))
                next
              }
              n <- tryCatch(nrow(suppressWarnings(read_csv(f, show_col_types = FALSE))),
                            error = function(e) NA_integer_)
              # Deliberately not modification time: actions/checkout rewrites every file at
              # checkout time, so mtime is always ~0 here and STALE never fired.
              # The last commit that touched the file is the real data age.
              # %ct is epoch seconds — %cI emits a trailing "Z" that strptime %z
              # will not parse, which silently produced NA for every file.
              ts  <- suppressWarnings(system2("git", c("log","-1","--format=%ct","--",f),
                                              stdout = TRUE, stderr = FALSE))
              age <- if (length(ts) == 1 && nzchar(ts) && !is.na(suppressWarnings(as.numeric(ts))))
                       round((as.numeric(Sys.time()) - as.numeric(ts)) / 3600, 1)
                     else NA_real_
              status <- "OK"
              if (is.na(n) || n == 0) {
                status <- "EMPTY"
                problems <- c(problems, paste(basename(f), "empty"))
              } else if (!is.na(age) && age > (if (f %in% names(max_age)) max_age[[f]] else 36)) {
                status <- "STALE"
                problems <- c(problems, paste(basename(f), "stale"))
              }
              out <- c(out, sprintf("| `%s` | %s | %s | %s |", basename(f), n, age, status))
            }
            # A row count cannot catch the failure that matters for the valuation
            # inputs: if SEC renames an XBRL concept the fetch still returns one
            # row per ticker with every value NA, write_or_keep sees a non-empty
            # frame and overwrites the good data. Check coverage, not row count.
            if (file.exists("data/sec_financials.csv")) {
              sfin <- tryCatch(read_csv("data/sec_financials.csv", show_col_types = FALSE),
                               error = function(e) NULL)
              if (is.null(sfin) || !"fcf_sec" %in% names(sfin)) {
                problems <- c(problems, "sec_financials unreadable or missing fcf_sec")
                out <- c(out, "", "**DCF inputs:** unreadable.")
              } else {
                cov <- sum(!is.na(sfin$fcf_sec))
                cagr <- if ("rev_cagr_sec" %in% names(sfin)) sum(!is.na(sfin$rev_cagr_sec)) else 0
                out <- c(out, "",
                         sprintf("**DCF inputs:** free cash flow %d/%d, revenue CAGR %d/%d.",
                                 cov, nrow(sfin), cagr, nrow(sfin)))
                if (cov < 100)
                  problems <- c(problems,
                                sprintf("DCF free-cash-flow coverage collapsed to %d/%d", cov, nrow(sfin)))
              }
            }

            if (file.exists("data/tv_channels.csv")) {
              tv <- tryCatch(read_csv("data/tv_channels.csv", show_col_types = FALSE),
                             error = function(e) NULL)
              if (!is.null(tv) && "is_live" %in% names(tv)) {
                nlive <- sum(as.logical(tv$is_live), na.rm = TRUE)
                out <- c(out, "", sprintf("**Live TV:** %d/%d channels streaming.", nlive, nrow(tv)))
                # Several major broadcasters run 24/7, so zero live means the
                # resolver broke rather than everyone going off air at once.
                if (nlive == 0) problems <- c(problems, "no live TV channels resolved")
              }
            }

            out <- c(out, "")
            if (length(problems) > 0) {
              out <- c(out, sprintf("**%d issue(s):** %s", length(problems),
                                    paste(problems, collapse = "; ")))
            } else {
              out <- c(out, "All outputs present and fresh.")
            }
            cat(paste(out, collapse = "\n"), "\n")
            sf <- Sys.getenv("GITHUB_STEP_SUMMARY")
            if (nzchar(sf)) writeLines(out, sf)
          '

      # Connect Cloud deploys from the repo and validates each file against a
      # checksum in manifest.json. The pipeline rewrites every CSV nightly, so
      # a manifest committed once would be stale by the next run and the
      # deployed app would not match what the manifest claims.
      - name: Refresh Connect Cloud manifest
        if: always()
        continue-on-error: true
        run: |
          Rscript -e '
            if (!requireNamespace("rsconnect", quietly = TRUE)) {
              message("rsconnect unavailable — leaving manifest untouched.")
            } else if (!file.exists("app/app.R")) {
              message("app/app.R missing — leaving manifest untouched.")
            } else {
              ok <- tryCatch({
                rsconnect::writeManifest(appDir = "app", appPrimaryDoc = "app.R")
                TRUE
              }, error = function(e) { message("Manifest refresh failed: ",
                                               conditionMessage(e)); FALSE })
              if (ok) {
                m <- jsonlite::fromJSON("app/manifest.json")
                message(sprintf("Manifest refreshed: %d files, %d packages.",
                                length(m$files), length(m$packages)))
              }
            }
          '

      - name: Clean stale files and commit updated data
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Remove stale nested app/app/ directory (duplicate data from old pipeline)
          if [ -d "app/app" ]; then
            git rm -r --cached app/app/ 2>/dev/null || true
            rm -rf app/app/
          fi

          git add data/alpha_history.csv data/av_cache.csv data/polygon_cache.csv \
                  data/*.csv data/*.rds app/*.csv app/*.rds app/data/*.rds \
                  app/manifest.json || true
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "Auto-update: Daily alpha refresh $(date +'%Y-%m-%d')"
          git push || true

      - name: Strip Bioconductor packages before deploy
        run: |
          Rscript -e '
            # rsconnect packrat scanner picks up ALL installed packages and their
            # dependency chains.  tidyquant → timetk → recipes (Bioconductor) breaks
            # the manifest.  Remove the entire chain so rsconnect never sees it.
            nuke <- c("recipes","timetk","tidyquant","hardhat","workflows",
                       "parsnip","rsample","yardstick","modeldata","tune",
                       "workflowsets","infer","corrr","modelenv")
            for (pkg in nuke) {
              if (requireNamespace(pkg, quietly=TRUE)) {
                try(remove.packages(pkg), silent=TRUE)
                message("Removed: ", pkg)
              }
            }
            message("Remaining packages: ", length(.packages(all.available=TRUE)))
          '

      # No continue-on-error: a silently failed deploy leaves the live site
      # stale while the run still reports green.  Transient failures are
      # retried below; a genuine one must turn the run red so GitHub notifies.
      # Non-fatal on purpose. The primary host is Connect Cloud, which deploys
      # from the repo itself; shinyapps.io is the legacy target and is being
      # retired at the end of 2026. Letting it fail the run meant a healthy
      # nightly refresh — data pulled, verified and committed — reported as a
      # total failure and sent a failure email, which trains you to ignore them.
      - name: Deploy to shinyapps.io (legacy, non-fatal)
        continue-on-error: true
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e '
            acct   <- Sys.getenv("SHINYAPPS_ACCOUNT")
            token  <- Sys.getenv("SHINYAPPS_TOKEN")
            secret <- Sys.getenv("SHINYAPPS_SECRET")

            if (nchar(acct) == 0 || nchar(token) == 0 || nchar(secret) == 0) {
              message("Skipping deploy — secrets not set.")
              quit(status = 0)
            }

            message("=== DEPLOY CONFIG ===")
            message("Account: ", acct)
            message("rsconnect version: ", packageVersion("rsconnect"))
            message("=====================")

            library(rsconnect)
            rsconnect::setAccountInfo(name=acct, token=token, secret=secret)

            # List files to deploy (exclude nested app/ subdir)
            app_files <- list.files("app", recursive = TRUE)
            app_files <- app_files[!grepl("^app/", app_files)]

            # Retry transient shinyapps.io failures; fail loudly if all fail.
            ok <- FALSE
            for (attempt in 1:3) {
              ok <- tryCatch({
                rsconnect::deployApp(
                  appDir      = "app",
                  appName     = "r-codescreener",
                  account     = acct,
                  appFiles    = app_files,
                  forceUpdate = TRUE
                )
                TRUE
              }, error = function(e) {
                message("Deploy attempt ", attempt, " failed: ", conditionMessage(e))
                FALSE
              })
              if (isTRUE(ok)) break
              if (attempt < 3) { message("Retrying in 30s..."); Sys.sleep(30) }
            }
            if (!isTRUE(ok)) stop("Deploy failed after 3 attempts")
            message("Deploy complete.")
          '

      # The failure mode that actually cost time here was silence: the pipeline
      # broke and nothing said so, so it stayed broken for days. A failed run
      # now opens a tracking issue, which emails the repo owner. Repeat failures
      # comment on the existing issue rather than opening one a night.
      #
      # Written as a Python file rather than inline shell: building JSON through
      # nested shell quoting produced literal newlines inside string values,
      # which is invalid JSON. Every failure path is swallowed so that reporting
      # a failure can never itself fail the job.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > /tmp/report_failure.py <<'PYSCRIPT'
          import json, os, urllib.request, datetime

          token = os.environ["GH_TOKEN"]
          repo  = os.environ["REPO"]
          run   = os.environ["RUN_URL"]
          today = datetime.datetime.utcnow().strftime("%Y-%m-%d")
          api   = "https://api.github.com/repos/" + repo

          def call(url, payload=None):
              data = json.dumps(payload).encode() if payload else None
              req = urllib.request.Request(url, data=data)
              req.add_header("Authorization", "Bearer " + token)
              req.add_header("Accept", "application/vnd.github+json")
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read().decode()
              return json.loads(body) if body.strip() else None

          existing = None
          try:
              found = call(api + "/issues?state=open&labels=pipeline-failure&per_page=1")
              if found:
                  existing = found[0]["number"]
          except Exception as e:
              print("lookup failed:", e)

          try:
              if existing:
                  call(api + "/issues/%d/comments" % existing,
                       {"body": "Failed again on %s.\n\nRun: %s" % (today, run)})
                  print("commented on issue #%d" % existing)
              else:
                  call(api + "/issues", {
                      "title": "Daily pipeline failed (%s)" % today,
                      "labels": ["pipeline-failure"],
                      "body": ("The scheduled run failed.\n\n"
                               "Run: %s\n\n"
                               "The site is not down. Data files are preserved when a fetch "
                               "returns empty and the deploy is skipped, so it keeps serving "
                               "the last good data. This tracks the refresh being stalled.\n\n"
                               "Close once a run goes green." % run)})
                  print("opened a pipeline-failure issue")
          except Exception as e:
              print("report failed:", e)
          PYSCRIPT
          python3 /tmp/report_failure.py || true
          exit 0
